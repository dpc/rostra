[package]
name = "rostra-p2p-api"
description = "Shared ALPN constants for the Rostra peer-to-peer protocol"
edition = { workspace = true }
license = "MIT OR Apache-2.0 OR MPL-2.0"
version = { workspace = true }
repository = "https://github.com/dpc/rostra"
homepage = "https://rostra.me"
documentation = "https://docs.rs/rostra-p2p-api"
readme = "README.md"
keywords = ["rostra", "p2p", "iroh", "networking"]
categories = ["network-programming"]
include = [
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "LICENSE-MPL",
  "src/**",
]

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
iroh = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
